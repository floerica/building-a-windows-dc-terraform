---
# need to wrap an if statement around this one
# make it windows specific
- name: include Defender tasks
  ansible.builtin.include_tasks: windows-disable-defender.yml
  when: ansible_distribution is search ('Microsoft')

- name: Set Hostname
  ansible.windows.win_hostname:
    name: "{{ inventory_hostname_short }}"
  register: reboot

- name: Reboot
  ansible.windows.win_reboot:
  when: reboot.reboot_required

